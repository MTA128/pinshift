name: Build GooseRoute Android Beta
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK API 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run timing unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - name: Upload static QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GooseRoute-Static-QA
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Generate SHA256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk | tee SHA256SUMS
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooseRoute-Android-Beta
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - name: Publish the beta APK to GitHub Releases (once)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v3.0.0-beta.1 >/dev/null 2>&1; then
            gh release create v3.0.0-beta.1               "app/build/outputs/apk/debug/app-debug.apk#GooseRoute-beta.apk"               "app/build/outputs/apk/debug/SHA256SUMS#SHA256SUMS"               --title "GooseRoute 3.0 beta 1" --prerelease               --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            echo "Beta release already exists. Leaving previously published APK unchanged."
          fi
          # Set a clear filename for public downloads (not just a display label).
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.0.0-beta.1" --jq '.assets[] | select(.name=="app-debug.apk") | .id' || true)"
          if [ -n "$ASSET_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -f name=GooseRoute-beta.apk >/dev/null
            echo "Public APK renamed to GooseRoute-beta.apk"
          fi
