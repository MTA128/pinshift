name: GooseRoute Emulator Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/device-tests.yml'

jobs:
  test-on-android-15:
    name: Emulator Android 15 (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch emulator and execute tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.goose.pinshift android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.goose.pinshift android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.goose.pinshift android.permission.POST_NOTIFICATIONS
            adb shell appops set com.goose.pinshift android:mock_location allow
            adb shell am instrument -w -r com.goose.pinshift.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-output.txt
            grep -q 'OK (' instrumentation-output.txt
      - name: Capture emulator screenshot and diagnostics
        if: always()
        run: |
          adb shell am start -n com.goose.pinshift/.MainActivity || true
          sleep 4
          adb exec-out screencap -p > emulator-screen.png || true
          adb logcat -d -v time -t 3000 > emulator-logcat.txt || true
      - name: Upload device-test logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GooseRoute-Device-Test-Report
          path: |
            instrumentation-output.txt
            emulator-screen.png
            emulator-logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
